# Cloudflare Pages configuration.
#
# vercel.json is untouched — the two deploy targets are independent and neither
# reads the other's settings.
#
# Why .toml with pages_build_output_dir rather than the Workers-style JSON: a
# Pages project rejects a Workers config outright. The build log showed
#   "A Wrangler configuration file was found but it does not appear to be valid.
#    Did you mean to use wrangler.toml to configure Pages? ... Skipping file"
# which means the config was ignored entirely rather than applied.

# MUST match the Pages project name in the Cloudflare dashboard exactly.
# A mismatch here does not error — it targets a different (or new) project.
name = "forgefy"

# Vite writes the client bundle here. Confirmed from the build log:
#   dist/client/assets/... and dist/client/_shell.html
# Note this is the CLIENT directory: dist/server/ is the SSR bundle, used only
# by the build's prerender step, and must not be published.
pages_build_output_dir = "dist/client"

compatibility_date = "2026-08-07"

# NOTE — build-time variables do NOT belong here. Anything Vite inlines
# (VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
# VITE_API_URL) must be set as build environment variables in the Pages
# dashboard: Settings → Environment variables → Production/Preview.
#
# A [vars] block here would only bind at RUNTIME for Pages Functions, which is
# too late — Vite has already baked the values into the bundle at build time.
# Missing VITE_FIREBASE_* is what failed the last build: firebase.ts calls
# getAuth() at module scope, the prerender step imports it, and an undefined
# apiKey throws auth/invalid-api-key before a single page renders.
